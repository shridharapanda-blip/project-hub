<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ProjectHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background: #080b16;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            border: 1px solid #29334d;
            border-radius: 18px;
            background: #111729;
            box-shadow: 0 15px 50px #0006;
        }

        .logo {
            margin-bottom: 20px;
            color: #a78bfa;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            transition: 0.2s;
        }

        .logo:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 24px;
            color: #aab2c5;
            text-align: center;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #dce3f5;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #34405c;
            border-radius: 9px;
            outline: none;
            background: #0b1020;
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #a78bfa;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .login-link {
            margin-top: 22px;
            color: #aab2c5;
            text-align: center;
        }

        a {
            color: #a78bfa;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="register-card">
        <a href="home.html" style="text-decoration: none;">
            <div class="logo">✦ ProjectHub</div>
        </a>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join students, discover projects, and build something amazing.
        </p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
                minlength="2"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>
    </main>

    <script src="config.js"></script>
    <script src="register.js"></script>
</body>
</html>
