<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | ProjectHub</title>

    <link rel="stylesheet" href="messages.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="auth_guard.js"></script>
</head>

<body>

    <div class="messenger">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <a href="home.html" class="back-btn" title="Back to Home">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <h2>Messages</h2>

                <button class="icon-btn" id="newMessageBtn" title="New message">
                    <i class="fa-regular fa-pen-to-square"></i>
                </button>
            </div>

            <!-- SEARCH -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search people..."
                >
            </div>

            <!-- ONLINE USERS -->
            <div class="online-section">

                <h3>Active now</h3>

                <div class="online-users" id="onlineUsers">

                    <button class="online-user" data-user="1">
                        <div class="avatar-wrap">
                            <div class="avatar purple">AS</div>
                            <span class="online-dot"></span>
                        </div>
                        <span>Aditya</span>
                    </button>

                    <button class="online-user" data-user="2">
                        <div class="avatar-wrap">
                            <div class="avatar cyan">PS</div>
                            <span class="online-dot"></span>
                        </div>
                        <span>Priya</span>
                    </button>

                    <button class="online-user" data-user="3">
                        <div class="avatar-wrap">
                            <div class="avatar pink">RK</div>
                            <span class="online-dot"></span>
                        </div>
                        <span>Rahul</span>
                    </button>

                </div>

            </div>

            <!-- CONVERSATIONS -->
            <div class="chat-list-header">
                <h3>Recent messages</h3>
                <span id="chatCount">4 chats</span>
            </div>

            <div class="chat-list" id="chatList">

                <button class="chat-user active" data-user="1">

                    <div class="avatar-wrap">
                        <div class="avatar purple">AS</div>
                        <span class="online-dot"></span>
                    </div>

                    <div class="chat-info">
                        <div class="chat-name">
                            <strong>Aditya Sharma</strong>
                            <span class="chat-time">2m</span>
                        </div>

                        <div class="chat-preview">
                            Hey! Let's discuss our project.
                        </div>
                    </div>

                    <span class="unread-count">2</span>

                </button>

                <button class="chat-user" data-user="2">

                    <div class="avatar-wrap">
                        <div class="avatar cyan">PS</div>
                        <span class="online-dot"></span>
                    </div>

                    <div class="chat-info">
                        <div class="chat-name">
                            <strong>Priya Singh</strong>
                            <span class="chat-time">10m</span>
                        </div>

                        <div class="chat-preview">
                            Can you share the project link?
                        </div>
                    </div>

                </button>

                <button class="chat-user" data-user="3">

                    <div class="avatar-wrap">
                        <div class="avatar pink">RK</div>
                    </div>

                    <div class="chat-info">
                        <div class="chat-name">
                            <strong>Rahul Kumar</strong>
                            <span class="chat-time">1h</span>
                        </div>

                        <div class="chat-preview">
                            Thanks for your help!
                        </div>
                    </div>

                </button>

                <button class="chat-user" data-user="4">

                    <div class="avatar-wrap">
                        <div class="avatar orange">SM</div>
                    </div>

                    <div class="chat-info">
                        <div class="chat-name">
                            <strong>Simran Mishra</strong>
                            <span class="chat-time">3h</span>
                        </div>

                        <div class="chat-preview">
                            Let's work together.
                        </div>
                    </div>

                </button>

            </div>

        </aside>


        <!-- RIGHT CHAT AREA -->
        <main class="chat-area" id="chatArea">

            <!-- CHAT HEADER -->
            <header class="chat-header">

                <div class="chat-profile">

                    <button class="mobile-back" id="mobileBack">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <div class="avatar-wrap">
                        <div class="avatar purple" id="headerAvatar">AS</div>
                        <span class="online-dot" id="headerOnlineDot"></span>
                    </div>

                    <div>
                        <h3 id="headerName">Aditya Sharma</h3>
                        <p id="headerStatus">Online now</p>
                    </div>

                </div>

                <div class="chat-actions">
                    <button class="icon-btn" id="voiceCallBtn" title="Voice call">
                        <i class="fa-solid fa-phone"></i>
                    </button>

                    <button class="icon-btn" id="videoCallBtn" title="Video call">
                        <i class="fa-solid fa-video"></i>
                    </button>

                    <button class="icon-btn" id="moreOptionsBtn" title="More options">
                        <i class="fa-solid fa-ellipsis"></i>
                    </button>

                    <!-- OPTIONS DROPDOWN -->
                    <div class="options-menu" id="optionsMenu">
                        <button class="option-item" id="optViewProfile">
                            <i class="fa-solid fa-user"></i> View Profile
                        </button>
                        <button class="option-item" id="optCopyLink">
                            <i class="fa-solid fa-link"></i> Copy Chat Link
                        </button>
                        <button class="option-item" id="optMute">
                            <i class="fa-solid fa-bell-slash"></i> Mute Notifications
                        </button>
                        <button class="option-item danger" id="optClearChat">
                            <i class="fa-solid fa-trash"></i> Clear Messages
                        </button>
                    </div>
                </div>

            </header>


            <!-- MESSAGES -->
            <section class="messages" id="messages">
                <div class="date-divider">
                    <span>Today</span>
                </div>
            </section>

            <!-- QUICK EMOJI BAR (TOGGLED BY EMOJI BTN) -->
            <div class="quick-emoji-bar" id="quickEmojiBar" style="display: none;">
                <span class="emoji-pill" data-emoji="👋">👋</span>
                <span class="emoji-pill" data-emoji="🚀">🚀</span>
                <span class="emoji-pill" data-emoji="👍">👍</span>
                <span class="emoji-pill" data-emoji="💻">💻</span>
                <span class="emoji-pill" data-emoji="🔥">🔥</span>
                <span class="emoji-pill" data-emoji="💡">💡</span>
                <span class="emoji-pill" data-emoji="🎉">🎉</span>
                <span class="emoji-pill" data-emoji="👏">👏</span>
                <span class="emoji-pill" data-emoji="✨">✨</span>
            </div>

            <!-- MESSAGE INPUT -->
            <form class="message-form" id="messageForm">

                <button type="button" class="icon-btn" id="attachFileBtn" title="Attach file">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="file" id="fileInput" style="display: none;" accept="image/*,.pdf,.doc,.docx,.zip,.txt">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    autocomplete="off"
                    required
                >

                <button type="button" class="icon-btn" id="emojiBtn" title="Emoji">
                    <i class="fa-regular fa-face-smile"></i>
                </button>

                <button type="submit" class="send-btn" title="Send message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </form>

        </main>

    </div>

    <!-- CALL MODAL -->
    <div class="call-modal-overlay" id="callModal">
        <div class="call-dialog">
            <div class="call-avatar-wrap">
                <div class="call-pulse"></div>
                <div class="call-avatar purple" id="callAvatar">AS</div>
            </div>
            <h3 id="callUserName">Aditya Sharma</h3>
            <p class="call-status" id="callStatusText">Calling...</p>

            <div class="call-actions-row">
                <button class="call-action-btn" id="callMuteBtn" title="Mute microphone">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button class="call-action-btn" id="callVideoBtn" title="Video camera">
                    <i class="fa-solid fa-video"></i>
                </button>
                <button class="call-action-btn end-call" id="callEndBtn" title="End call">
                    <i class="fa-solid fa-phone-slash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- NEW MESSAGE MODAL -->
    <div class="new-msg-overlay" id="newMsgModal">
        <div class="new-msg-card">
            <div class="new-msg-header">
                <h3>New Conversation</h3>
                <button class="close-btn" id="closeNewMsgBtn">&times;</button>
            </div>
            <div class="new-msg-list" id="newMsgList">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="messages.js"></script>

</body>
</html>
